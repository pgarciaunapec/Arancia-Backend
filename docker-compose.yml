version: "2.1"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
        PORT: ${PORT:-3003}
        JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    container_name: ${BACKEND_CONTAINER_NAME:-arancia-backend}
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT:-3003}:${PORT:-3003}
    environment:
      PORT: ${PORT:-3003}
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:Pantonio2404@mongodb:27017/arancia}
      JWT_SECRET: ${JWT_SECRET:-arancia_prod_Xy7n8R!kQwq2Z7v}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DOMAIN: ${DOMAIN:-localhost}
      TRAEFIK_ROUTER_NAME: ${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}
      TRAEFIK_SERVICE_NAME: ${TRAEFIK_SERVICE_NAME:-arancia-backend-dev}
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    networks:
      - arancia-network
      - dokploy-network
      - default
    labels:
      # Router HTTPS (websecure)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-websecure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-websecure.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-websecure.service=${TRAEFIK_SERVICE_NAME:-arancia-backend-dev}
      
      # Router HTTP (redirection to HTTPS)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-web.entrypoints=web
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend-dev}-web.middlewares=redirect-to-https
      
      # Service backend
      - traefik.http.services.${TRAEFIK_SERVICE_NAME:-arancia-backend-dev}.loadbalancer.server.port=${PORT:-3003}
      - traefik.enable=true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://localhost:${PORT:-3003}/api', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  arancia-network:
    driver: bridge
  dokploy-network:
    external: true
volumes:
  uploads_data:
    driver: local
