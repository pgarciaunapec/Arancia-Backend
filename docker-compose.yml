version: "3.8"

services:
  backend:
    build: .
    image: arancia-backend:latest
    restart: always
    ports:
      - "${BACKEND_PORT:-3003}:3003"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${PORT:-3003}"
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:Pantonio2404@mongodb:27017/arancia}"
      JWT_SECRET: "${JWT_SECRET:-arancia_prod_Xy7n8R!kQwq2Z7v}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      DOMAIN: "${DOMAIN:-localhost}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.arancia-backend.rule=Host(`arancia-api-dev.nauvolan.abrdns.com`)"
      - "traefik.http.routers.arancia-backend.entrypoints=websecure"
      - "traefik.http.routers.arancia-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.arancia-backend.loadbalancer.server.port=3003"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network
