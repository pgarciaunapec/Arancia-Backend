version: "3.8"

services:
  backend:
    build: .
    image: arancia-backend:latest
    restart: always
    env_file: .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=${PORT:-3003}
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    # Traefik Labels - Variablizados para Dokploy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}.tls.certresolver=letsencrypt
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}.service=${TRAEFIK_SERVICE_NAME:-arancia-backend}
      - traefik.http.services.${TRAEFIK_SERVICE_NAME:-arancia-backend}.loadbalancer.server.port=${PORT:-3003}
      - traefik.http.services.${TRAEFIK_SERVICE_NAME:-arancia-backend}.loadbalancer.server.scheme=http
      # Middleware para headers de seguridad (opcional pero recomendado)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}.middlewares=securityheaders
      - traefik.http.middlewares.securityheaders.headers.accesscontrolalloworiginlist=${FRONTEND_URL}
      - traefik.http.middlewares.securityheaders.headers.accesscontrolmaxage=100
      - traefik.http.middlewares.securityheaders.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
      - traefik.http.middlewares.securityheaders.headers.accesscontrolallowheaders=*
    volumes:
      - uploads:/app/uploads
    networks:
      - dokploy-network

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
