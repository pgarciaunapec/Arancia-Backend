    image: arancia-backend:latest
    restart: always
    env_file: .env
    environment:
      # Use external MongoDB host provided (overrides .env MONGODB_URI)
      - MONGODB_URI=mongodb://mongo:Pantonio2404@129.213.147.180:27017
    ports:
      - "5000:5000"
