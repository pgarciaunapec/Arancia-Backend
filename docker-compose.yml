version: "3.8"

services:
  backend:
    build: .
    image: arancia-backend:latest
    restart: always
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    networks:
      - dokploy

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
