version: "3.8"

services:
  backend:
    build: .
    image: arancia-backend:latest
    restart: always
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/restaurant01
      # - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8080}}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    networks:
      - dokploy-network

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
