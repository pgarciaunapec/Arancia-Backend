version: "3.8"

services:
  backend:
    build: .
    image: arancia-backend:latest
    restart: always
    env_file: .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=${PORT:-3003}
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    # Traefik Labels - Variablizados para Dokploy
    labels:
      - traefik.enable=true
      # Router HTTPS (websecure)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-websecure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-websecure.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-websecure.service=${TRAEFIK_SERVICE_NAME:-arancia-backend}
      # Router HTTP (redirección a HTTPS)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-web.entrypoints=web
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-web.middlewares=redirect-to-https
      # Middleware de redirección HTTP a HTTPS
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      # Servicio (sin conflicto con servicios automáticos)
      - traefik.http.services.${TRAEFIK_SERVICE_NAME:-arancia-backend}.loadbalancer.server.port=${PORT:-3003}
      - traefik.http.services.${TRAEFIK_SERVICE_NAME:-arancia-backend}.loadbalancer.server.scheme=http
      # Security Headers Middleware
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-arancia-backend}-websecure.middlewares=securityheaders
      - traefik.http.middlewares.securityheaders.headers.accesscontrolalloworiginlist=${FRONTEND_URL}
      - traefik.http.middlewares.securityheaders.headers.accesscontrolmaxage=100
      - traefik.http.middlewares.securityheaders.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
      - traefik.http.middlewares.securityheaders.headers.accesscontrolallowheaders=*
    volumes:
      - uploads:/app/uploads
    networks:
      - dokploy-network

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
